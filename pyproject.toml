[project]
name = "ese-5420-project"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
]

[tool.jupytext]
formats = "ipynb,py:percent"
